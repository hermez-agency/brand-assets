<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Des tuiles éparpillées se rangent en grille, une case est mise en avant" data-brand="react-resource-view" stroke-linecap="round" stroke-linejoin="round">
<style>
svg[data-brand="react-resource-view"]{--ill-bg:#fbf3e4;--ill-surface:#f3e6cf;--ill-line:#dccaa8;--ill-ink:#231a10;--ill-mute:#b09c7e;--ill-accent:#e8611a;--ill-soft:#f9d2b0}
@media (prefers-color-scheme:dark){svg[data-brand="react-resource-view"]{--ill-bg:#18130c;--ill-surface:#251d12;--ill-line:#44371f;--ill-ink:#fbf3e4;--ill-mute:#8a7757;--ill-accent:#f2803f;--ill-soft:#4d2c13}}
.dark svg[data-brand="react-resource-view"]{--ill-bg:#18130c;--ill-surface:#251d12;--ill-line:#44371f;--ill-ink:#fbf3e4;--ill-mute:#8a7757;--ill-accent:#f2803f;--ill-soft:#4d2c13}
.light svg[data-brand="react-resource-view"]{--ill-bg:#fbf3e4;--ill-surface:#f3e6cf;--ill-line:#dccaa8;--ill-ink:#231a10;--ill-mute:#b09c7e;--ill-accent:#e8611a;--ill-soft:#f9d2b0}
</style>
<rect width="1600" height="900" fill="var(--ill-bg)"/>
<g fill="var(--ill-surface)" stroke="var(--ill-line)" stroke-width="4">
<rect x="180" y="250" width="120" height="120" rx="24" transform="rotate(-12 240 310)"/>
<rect x="400" y="170" width="96" height="96" rx="24" transform="rotate(14 448 218)"/>
<rect x="290" y="480" width="150" height="104" rx="24" transform="rotate(8 365 532)"/>
<rect x="520" y="400" width="96" height="96" rx="24" transform="rotate(-18 568 448)"/>
<rect x="200" y="660" width="96" height="96" rx="24" transform="rotate(20 248 708)"/>
</g>
<g fill="var(--ill-mute)"><circle cx="500" cy="640" r="14"/><circle cx="600" cy="230" r="10"/></g>
<line x1="690" y1="450" x2="940" y2="450" stroke="var(--ill-line)" stroke-width="8"/>
<circle cx="690" cy="450" r="14" fill="var(--ill-mute)"/>
<g fill="var(--ill-surface)" stroke="var(--ill-ink)" stroke-width="8">
<rect x="1000" y="250" width="110" height="110" rx="24"/><rect x="1130" y="250" width="110" height="110" rx="24"/><rect x="1260" y="250" width="110" height="110" rx="24"/>
<rect x="1000" y="380" width="110" height="110" rx="24"/><rect x="1260" y="380" width="110" height="110" rx="24"/>
<rect x="1000" y="510" width="110" height="110" rx="24"/><rect x="1130" y="510" width="110" height="110" rx="24"/><rect x="1260" y="510" width="110" height="110" rx="24"/>
</g>
<rect x="1130" y="380" width="110" height="110" rx="24" fill="var(--ill-accent)"/>
<circle cx="940" cy="450" r="14" fill="var(--ill-accent)"/>
</svg>
