<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Des tuiles éparpillées visent une cible dont le centre est atteint" data-brand="leadz" stroke-linecap="round" stroke-linejoin="round">
<style>
svg[data-brand="leadz"]{--ill-bg:#f6f6f7;--ill-surface:#ebebed;--ill-line:#d1d1d6;--ill-ink:#18181b;--ill-mute:#a1a1aa;--ill-accent:#e8611a;--ill-soft:#fcd9c4}
@media (prefers-color-scheme:dark){svg[data-brand="leadz"]{--ill-bg:#0f0f12;--ill-surface:#1b1b20;--ill-line:#34343c;--ill-ink:#f4f4f5;--ill-mute:#71717a;--ill-accent:#f2803f;--ill-soft:#41261a}}
.dark svg[data-brand="leadz"]{--ill-bg:#0f0f12;--ill-surface:#1b1b20;--ill-line:#34343c;--ill-ink:#f4f4f5;--ill-mute:#71717a;--ill-accent:#f2803f;--ill-soft:#41261a}
.light svg[data-brand="leadz"]{--ill-bg:#f6f6f7;--ill-surface:#ebebed;--ill-line:#d1d1d6;--ill-ink:#18181b;--ill-mute:#a1a1aa;--ill-accent:#e8611a;--ill-soft:#fcd9c4}
</style>
<rect width="1600" height="900" fill="var(--ill-bg)"/>
<g fill="var(--ill-surface)" stroke="var(--ill-line)" stroke-width="4">
<rect x="180" y="250" width="120" height="120" rx="24" transform="rotate(-12 240 310)"/>
<rect x="400" y="170" width="96" height="96" rx="24" transform="rotate(14 448 218)"/>
<rect x="290" y="480" width="150" height="104" rx="24" transform="rotate(8 365 532)"/>
<rect x="520" y="400" width="96" height="96" rx="24" transform="rotate(-18 568 448)"/>
<rect x="200" y="660" width="96" height="96" rx="24" transform="rotate(20 248 708)"/>
</g>
<g fill="var(--ill-mute)"><circle cx="500" cy="640" r="14"/><circle cx="600" cy="230" r="10"/></g>
<line x1="690" y1="450" x2="940" y2="450" stroke="var(--ill-line)" stroke-width="8"/>
<circle cx="690" cy="450" r="14" fill="var(--ill-mute)"/>
<circle cx="1180" cy="450" r="240" fill="none" stroke="var(--ill-line)" stroke-width="4"/>
<circle cx="1180" cy="450" r="160" fill="var(--ill-soft)" stroke="var(--ill-ink)" stroke-width="8"/>
<circle cx="1180" cy="450" r="70" fill="var(--ill-accent)"/>
<line x1="940" y1="450" x2="1020" y2="450" stroke="var(--ill-accent)" stroke-width="8"/>
<circle cx="940" cy="450" r="14" fill="var(--ill-accent)"/>
</svg>
